<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календарь звонков</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 16px}li{margin:8px 0}button{padding:8px 12px}input{display:block;margin:8px 0;padding:8px;width:100%;max-width:360px}</style></head><body><h1>Календарь звонков</h1><p>Выберите свободное время:</p><ul id="slots"></ul><form id="form" hidden><input name="name" placeholder="Имя" required><input name="email" type="email" placeholder="Email" required><button>Забронировать</button></form><p id="message"></p><script>const list=document.querySelector('#slots'),form=document.querySelector('#form'),msg=document.querySelector('#message');let slotId;const showError=e=>{msg.textContent=e.message||'Не удалось загрузить свободные слоты'};const loadSlots=async()=>{list.replaceChildren();const r=await fetch('/api/slots');if(!r.ok)throw new Error('Не удалось загрузить свободные слоты');const slots=await r.json();slots.forEach(s=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=new Date(s.startsAt).toLocaleString();b.onclick=()=>{slotId=s.id;form.hidden=false;msg.textContent=''};li.append(b);list.append(li)})};loadSlots().catch(showError);form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const body=Object.fromEntries(new FormData(form));body.slotId=slotId;const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.error||'Не удалось забронировать слот');msg.textContent='Встреча забронирована';form.hidden=true;await loadSlots()}catch(error){showError(error)}finally{button.disabled=false}};</script></body></html>
